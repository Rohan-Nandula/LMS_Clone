<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TA Dashboard</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        color: #333;
      }
      form {
        margin-top: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="password"] {
        width: 400px;
        padding: 8px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      ul {
        list-style-type: none;
        padding: 0;
      }
      ul li {
        margin-bottom: 10px;
      }
      ul li a {
        color: #007bff;
        text-decoration: none;
      }
      ul li a:hover {
        text-decoration: underline;
      }
      .flash-success {
        color: green;
      }
      .flash-error {
        color: red;
      }
    </style>
  </head>
  <body>
    {% with messages = get_flashed_messages(with_categories=true) %} {% if
    messages %}
    <ul>
      {% for category, message in messages %}
      <li class="flash-{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %} {% endwith %}
    <h1>TA: {{ session['name'] }}</h1>
    <h2>Change Password</h2>
    <form method="post">
      <label for="old_password">Enter Current Password:</label><br>
      <input type="password" name="old_password" required><br><br>

      <label for="new_password">Enter New Password:</label><br>
      <input type="password" name="new_password" required><br><br>

      <label for="confirm_password">Confirm New Password:</label><br>
      <input type="password" name="confirm_password" required><br><br>

      <button type="submit" name="option" value="1">change password</button>
  </form>
    <h2>Menu:</h2>
        <ol>
        <li>
          <a href="{{url_for('ta.ta_dashboard')}}">Go Back</button>
        </li>
      </ol>
  </body>
</html>
