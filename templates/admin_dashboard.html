<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li class="flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <h1>Admin: Landing</h1>
    <h2>MENU:</h2>
    <form method="POST">
        <ul>
            <li><button type="submit" name="choice" value="1">1. Create a Faculty Account</button></li>
            <li><button type="submit" name="choice" value="2">2. Create E-textbook</button></li>
            <li><button type="submit" name="choice" value="3">3. Modify E-textbooks</button></li>
            <li><button type="submit" name="choice" value="4">4. Create New Active Course</button></li>
            <li><button type="submit" name="choice" value="5">5. Create New Evaluation Course</button></li>
            <li><button type="submit" name="choice" value="6">6. Logout</button></li>
        </ul>
    </form>
</body>
</html>
