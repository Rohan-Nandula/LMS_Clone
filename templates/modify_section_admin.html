<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Section</title>
</head>
<body>
    <div class="flash-messages">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <ul>
                {% for category, message in messages %}
                    <li class="flash-{{ category }}">{{ message }}</li>
                {% endfor %}
                </ul>
            {% endif %}
        {% endwith %}
    </div>

    <h1>Admin: Modify Section</h1>

    <form method="POST">
        <h2>Menu</h2>
        <label for="content_block_id">Enter Section ID to Modify:</label>
        <input type="text" name="section_number" required><br><br>
        <button type="submit" name="choice" value="1">1. Add New Content Block</button><br><br>
        <button type="submit" name="choice" value="2">2. Modify Content Block</button><br><br>
    </form>
    <form action="{{ url_for('modify_chapter_admin', textbook_id=textbook_id) }}">
        <button type="submit">3. Go Back</button>
    </form>
    <br>
    <form action="{{ url_for('admin_dashboard') }}">
        <button type="submit">4. Landing Page</button>
    </form>
</body>
</html>
