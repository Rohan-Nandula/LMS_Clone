<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modify Chapter</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li class="flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}
    
    <h1>Admin: Modify Chapter</h1>
    
    <form method="POST">
        <label for="chapter_number">Unique Chapter ID:</label>
        <input type="text" name="chapter_number" required><br><br>

        <h2>Menu</h2>
        <button type="submit" name="choice" value="1">1. Add New Section</button><br><br>
        <button type="submit" name="choice" value="2">2. Modify Section</button><br><br>
    </form>
    <form action="{{ url_for('modify_etextbooks') }}">
        <button type="submit">3. Go Back</button>
    </form>
    <br>
    <form action="{{ url_for('admin_dashboard') }}">
        <button type="submit">4. Landing Page</button>
    </form>
</body>
</html>
