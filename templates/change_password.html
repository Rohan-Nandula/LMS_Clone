<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Faculty - Change Password</title>
</head>
<body>
  <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=True) %}
      {% if messages %}
        <ul>
          {% for category, message in messages %}
            <li class="{{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}
    <h1>Change Password</h1>

    <form method="post">
        <label for="current_password">Enter Current Password:</label><br>
        <input type="password" name="current_password" required><br><br>

        <label for="new_password">Enter New Password:</label><br>
        <input type="password" name="new_password" required><br><br>

        <label for="confirm_password">Confirm New Password:</label><br>
        <input type="password" name="confirm_password" required><br><br>

        <button type="submit" name="option" value="1">Update</button>
        <a href="{{ url_for('faculty_dashboard') }}"><button type="button">Go Back</button></a>
    </form>

    
</body>
</html>
