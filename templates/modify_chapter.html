<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modify Chapter</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 20px;
      }
      h1 {
        color: #333;
      }
      form {
        margin-top: 20px;
      }
      label {
        display: block;
        margin-bottom: 5px;
      }
      input[type="text"] {
        width: 400px;
        padding: 8px;
        margin-bottom: 20px;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      ol,
      ul {
        list-style-type: none;
        padding: 0;
      }
      ol li,
      ul li {
        margin-bottom: 10px;
      }
      ul li a,
      ol li a {
        color: #007bff;
        text-decoration: none;
      }
      ul li a:hover,
      ol li a:hover {
        text-decoration: underline;
      }
      .flash-success {
        color: green;
      }
      .flash-error {
        color: red;
      }
      body {
        font-family: Arial, sans-serif;
        margin: 50px;
      }
      form {
        max-width: 400px;
        margin: auto;
        display: flex;
        flex-direction: column;
      }
      label,
      input {
        margin-bottom: 10px;
      }
      input {
        padding: 8px;
        font-size: 1rem;
      }
      .buttons {
        display: flex;
        flex-direction: column;
      }
      button {
        padding: 10px 20px;
        font-size: 1rem;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        margin-bottom: 10px;
      }
      .flash {
        max-width: 400px;
        margin: 10px auto;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- Display flash messages -->
    {% with messages = get_flashed_messages(with_categories=True) %} {% if
    messages %}
    <ul>
      {% for category, message in messages %}
      <li class="{{ category }}">{{ message }}</li>
      {% endfor %}
    </ul>
    {% endif %} {% endwith %}
    <h1>Modify Chapter</h1>

    <form
      method="POST"
      action="{{ url_for('modify_chapter', textbook_id=textbook_id) }}"
    >
      <label for="chapter_number">Chapter Number:</label>
      <input
        type="text"
        id="chapter_number"
        name="chapter_number"
      /><br /><br />

      <div class="buttons">
        <button type="submit" name="choice" value="1">1. Hide Chapter</button>
        <button type="submit" name="choice" value="2">2. Delete Chapter</button>
        <button type="submit" name="choice" value="3">
          3. Add New Section
        </button>
        <button type="submit" name="choice" value="4">4. Modify Section</button>
        <button type="submit" name="choice" value="5">5. Go Back</button>
      </div>
    </form>
  </body>
</html>
