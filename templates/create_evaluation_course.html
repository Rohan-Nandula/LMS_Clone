<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Evaluation Course</title>
</head>
<body>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <ul>
            {% for category, message in messages %}
                <li class="flash-{{ category }}">{{ message }}</li>
            {% endfor %}
            </ul>
        {% endif %}
    {% endwith %}

    <h1>Admin: Create New Evaluation Course</h1>

    <form method="POST">
        <label for="course_id">Unique Course ID:</label>
        <input type="text" name="course_id" required><br><br>

        <label for="course_name">Course Name:</label>
        <input type="text" name="course_name" required><br><br>

        <label for="etextbook_id">Unique ID of the E-textbook:</label>
        <input type="text" name="etextbook_id" required><br><br>

        <label for="faculty_id">Faculty Member ID:</label>
        <input type="text" name="faculty_id" required><br><br>

        <label for="start_date">Course Start Date:</label>
        <input type="date" name="start_date" required><br><br>

        <label for="end_date">Course End Date:</label>
        <input type="date" name="end_date" required><br><br>

        <h2>Menu</h2>
        <button type="submit" name="choice" value="1">1. Save</button><br><br>
    </form>
    <form action="{{ url_for('admin_dashboard') }}">
        <button type="submit">2. Cancel</button>
    </form>
    <br>
    <form action="{{ url_for('admin_dashboard') }}">
        <button type="submit">3. Landing Page</button>
    </form>
</body>
</html>
