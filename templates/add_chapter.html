<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add New Chapter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1 {
      color: #333;
    }
    form {
      margin-top: 20px;
    }
    label {
      display: block;
      margin-bottom: 5px;
    }
    input[type="text"] {
      width: 400px;
      padding: 8px;
      margin-bottom: 20px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 10px 20px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #218838;
    }
    ul {
      list-style-type: none;
      padding: 0;
    }
    ul li {
      margin-bottom: 10px;
    }
    ul li a {
      color: #007bff;
      text-decoration: none;
    }
    ul li a:hover {
      text-decoration: underline;
    }
    .flash-success {
      color: green;
    }
    .flash-error {
      color: red;
    }
  </style>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul>
        {% for category, message in messages %}
          <li class="flash-{{ category }}">{{ message }}</li>
        {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}

  <h1>Course ID: {{ session['course_id'] }}</h1>
  <h1>Add New Chapter</h1>

  <form method="POST">
    <label for="chapter_number">Unique Chapter ID (Format: chapXX):</label>
    <input type="text" name="chapter_number" required />

    <label for="chapter_title">Chapter Title:</label>
    <input type="text" name="chapter_title" required />
    <br/>
    <button type="submit" name="choice" value="1">Add New Section</button>
  </form>

  <ol>
    <li>
      <a href="{{ url_for('ta.active_course_menu' if role == 'TA' else 'active_course_menu' if role == 'Faculty' else 'create_etextbook') }}">Go Back</a>
    </li>
    <li>
      <a href="{{ url_for('ta.ta_dashboard' if role == 'TA' else 'faculty_dashboard' if role == 'Faculty' else 'admin_dashboard') }}">Landing Page</a>
    </li>
  </ol>
</body>
</html></form>
